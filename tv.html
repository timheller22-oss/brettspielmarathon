<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Leaderboard · Tims Brettspielmarathon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
:root{color-scheme:light only;--ink:#111;--red:#ff3d3d;--yel:#ffcc00;--blue:#00a6ed;--green:#7cc000;--orange:#ff7a00;--lila:#d63af9;
 --fd:"Bangers",Impact,sans-serif;--fb:"Comic Neue",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--blue);color:var(--ink);font:700 1.6vw/1.3 var(--fb)}
body{background-image:radial-gradient(rgba(255,255,255,.3) .35vw,transparent .4vw);background-size:1.6vw 1.6vw}
.frame{position:fixed;inset:1.2vw;display:flex;flex-direction:column;gap:1.2vw}
.top{display:flex;align-items:center;gap:1.5vw}
.top h1{margin:0;font:400 3.4vw/1 var(--fd);letter-spacing:.03em;color:var(--yel);-webkit-text-stroke:.18vw #111;text-shadow:.35vw .35vw 0 #111}
.top .sp{flex:1}
.clock{font:400 3.2vw/1 var(--fd);background:#111;color:var(--yel);padding:.4vw 1.2vw;letter-spacing:.06em}
.prog{width:18vw;height:1.6vw;border:.3vw solid #111;background:#fff;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--red)}
.prog span{position:absolute;inset:0;display:grid;place-items:center;font-size:1vw}
.stage{flex:1;position:relative;min-height:0}
.panel{position:absolute;inset:0;background:#fff;border:.45vw solid #111;box-shadow:.7vw .7vw 0 #111;padding:2vw 2.4vw;display:flex;flex-direction:column;gap:1.4vw;
 opacity:0;transform:translateX(4vw) rotate(1deg);transition:opacity .5s,transform .6s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.panel.on{opacity:1;transform:none}
.panel h2{margin:0;font:400 4vw/1 var(--fd);letter-spacing:.03em;color:var(--red);-webkit-text-stroke:.12vw #111;display:flex;align-items:center;gap:1vw}
.panel h2 small{font:700 1.4vw var(--fb);color:#555;-webkit-text-stroke:0}
.ticker{display:flex;align-items:stretch;border:.4vw solid #111;background:#ffcc00;height:3.6vw;overflow:hidden;transition:height .6s ease,border-width .6s ease,margin .6s ease}
.ticker.off{height:0;border-width:0;margin-top:-1.2vw}
.ticker b{background:#ff3d3d;color:#fff;font:400 2vw/3vw var(--fd);letter-spacing:.08em;padding:0 1.2vw;border-right:.4vw solid #111;-webkit-text-stroke:.08vw #111}
.tview{flex:1;overflow:hidden;position:relative}
.ttrack{position:absolute;white-space:nowrap;font:400 2vw/2.9vw var(--fd);letter-spacing:.04em;animation:tick var(--dur,40s) linear infinite;padding-left:100%}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ttrack{animation:none;padding-left:1vw}}
.dots{display:flex;gap:.6vw;justify-content:center}
.dots i{width:1vw;height:1vw;border:.25vw solid #111;background:#fff;border-radius:50%}
.dots i.on{background:var(--yel)}
.grid{display:grid;gap:1.2vw;flex:1;min-height:0;align-content:center}
.card{border:.35vw solid #111;padding:1vw 1.2vw;display:flex;flex-direction:column;gap:.5vw;background:var(--c,#fff)}
.card h3{margin:0;font:400 2.4vw/1 var(--fd);letter-spacing:.03em}
.timer{font:400 4.2vw/1 var(--fd);letter-spacing:.04em}
.names{display:flex;flex-wrap:wrap;gap:.5vw}
.chip{border:.25vw solid #111;background:#fff;padding:.1vw .8vw;border-radius:50%/45%;font-size:1.3vw}
table{width:100%;border-collapse:collapse;font-size:1.7vw}
th{font:400 1.4vw var(--fd);letter-spacing:.06em;text-align:left;padding:.3vw .6vw;border-bottom:.3vw solid #111}
td{padding:.45vw .6vw;border-bottom:.15vw dashed #999;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr.first td{background:#fff3bf}
.rank{font:400 2.2vw var(--fd);width:3.5vw}
.medal{font-size:2vw}
.award{border:.35vw solid #111;padding:1vw;display:flex;gap:1vw;align-items:center;background:#fff}
.award .ic{font-size:3.6vw}
.award b{display:block;font:400 1.6vw var(--fd);letter-spacing:.05em;color:#555}
.award .who{font:400 2.6vw/1 var(--fd);letter-spacing:.03em}
.cvrow{display:flex;gap:1.2vw;align-items:flex-start}
.cv{width:9vw;height:9vw;flex:none;object-fit:contain;background:#fff;border:.3vw solid #111;padding:.3vw}
.cv.sm{width:6vw;height:6vw}
/* Medaillenspiegel */
.md{--m1:#ffe27a;--m2:#e0a800;--m3:#8a6400;position:relative;display:inline-grid;place-items:center;width:2.9vw;height:2.9vw;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),radial-gradient(circle,var(--m1) 0 55%,var(--m2) 56% 100%);
 border:.22vw solid var(--m3);box-shadow:inset 0 0 0 .25vw #fff6,.15vw .2vw 0 #111;font:400 1.6vw/1 var(--fd);color:#111}
.md.s{--m1:#f4f6f8;--m2:#aab2bd;--m3:#5e6670}
.md.b{--m1:#f2b98a;--m2:#c46a2b;--m3:#7a3a12}
.md.big{width:5.4vw;height:5.4vw;font-size:3vw}
.md.big{color:#111;-webkit-text-stroke:0;margin-top:-.9vw}
.rib{display:block;width:3.2vw;height:2.6vw;border:.2vw solid #111;border-bottom:none;
 background:linear-gradient(90deg,#00a6ed 0 33%,#fff 33% 66%,#ff3d3d 66%);clip-path:polygon(0 0,100% 0,75% 100%,25% 100%)}
.ms{display:flex;gap:2vw;flex:1;min-height:0;align-items:stretch}
.podium{flex:1.1;display:flex;align-items:flex-end;justify-content:center;gap:.8vw;padding-top:1vw}
.pod{flex:1;max-width:14vw;display:flex;flex-direction:column;align-items:center;gap:.5vw}
.pod .nm{font:400 2.2vw/1 var(--fd);letter-spacing:.03em;text-align:center}
.pod .cnt{display:flex;gap:.6vw;font-size:1.3vw;align-items:center}
.pod .cnt span{display:flex;align-items:center;gap:.2vw}
.pod .cnt .md{width:1.5vw;height:1.5vw;border-width:.15vw;box-shadow:none}
.blk{width:100%;border:.35vw solid #111;display:grid;place-items:start center;padding-top:.6vw;font:400 4.5vw/1 var(--fd);color:#fff;-webkit-text-stroke:.15vw #111;
 background-image:radial-gradient(rgba(255,255,255,.35) .3vw,transparent .35vw);background-size:1.2vw 1.2vw}
.pod.p1 .blk{height:15vw;background-color:#ffcc00}.pod.p2 .blk{height:11vw;background-color:#b8c0ca}.pod.p3 .blk{height:8vw;background-color:#d08a52}
.mt{flex:1;align-self:flex-start;font-size:1.6vw}
.mt th .md{width:1.8vw;height:1.8vw;box-shadow:none;border-width:.15vw}
.mt td.c,.mt th.c{text-align:center}
.mt td.sum{font:400 1.9vw var(--fd)}
.mt .zero{color:#bbb}
/* Rangliste mit Balken */
.bars{display:flex;flex-direction:column;gap:.9vw;flex:1;justify-content:center}
.brow{display:grid;grid-template-columns:3.6vw 14vw 1fr 20vw;align-items:center;gap:1vw}
.bpos{width:3.2vw;height:3.2vw;border:.3vw solid #111;border-radius:50%;display:grid;place-items:center;font:400 1.9vw var(--fd);background:#fff}
.bpos.p1{background:#ffcc00}.bpos.p2{background:#d5dbe2}.bpos.p3{background:#e6a979}
.bname{font:400 2.2vw/1 var(--fd);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:3vw;border:.3vw solid #111;background:#f1f1f1;position:relative}
.btrack i{position:absolute;inset:0 auto 0 0;background:var(--bc);border-right:.3vw solid #111;display:flex;align-items:center;justify-content:flex-end;padding-right:.6vw;
 background-image:radial-gradient(rgba(255,255,255,.35) .25vw,transparent .3vw);background-size:1vw 1vw;animation:grow .9s cubic-bezier(.2,1.2,.4,1) both}
.btrack b{font:400 2vw var(--fd);color:#fff;-webkit-text-stroke:.12vw #111}
@keyframes grow{from{width:0}}
.bmeta{font-size:1.2vw;color:#444}
/* Spielkönig */
.kings{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw 2vw;flex:1;align-content:center}
.king{display:flex;flex-direction:column;align-items:center;gap:.4vw;position:relative}
.king .crown{position:absolute;top:-2.4vw;font-size:3vw;transform:rotate(-12deg)}
.ring{--rc:#00a6ed;width:9vw;height:9vw;border-radius:50%;border:.35vw solid #111;display:grid;place-items:center;
 background:conic-gradient(var(--rc) calc(var(--q)*1%),#eee 0)}
.ring span{width:68%;height:68%;border-radius:50%;background:#fff;border:.3vw solid #111;display:grid;place-items:center;font:400 2.6vw/1 var(--fd)}
.ring small{font-size:.5em}
.king.top .ring{--rc:#ffcc00;width:11vw;height:11vw}
.kn{font:400 1.9vw var(--fd);letter-spacing:.03em}.km{font-size:1.1vw;color:#555}
.ring.big{width:15vw;height:15vw}.ring.big span{font-size:4vw}
/* Awards als Sammelkarten */
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3vw 1.6vw;flex:1;align-content:center}
.acard{background:var(--ac);border:.4vw solid #111;box-shadow:.5vw .5vw 0 #111;padding:.7vw 1vw;display:flex;flex-direction:column;align-items:center;gap:.4vw;text-align:center}
.aburst{width:5.6vw;height:5.6vw;display:grid;place-items:center;font-size:2.9vw;background:#fff;
 clip-path:polygon(50% 0,61% 22%,88% 8%,80% 34%,100% 44%,80% 58%,94% 86%,66% 76%,52% 100%,40% 78%,12% 92%,20% 62%,0 50%,20% 36%,8% 10%,36% 22%)}
.aband{background:#111;color:#ffcc00;font:400 1.4vw var(--fd);letter-spacing:.08em;padding:.2vw 1vw;margin:0 -1.4vw}
.awho{font:400 2.8vw/1 var(--fd);letter-spacing:.03em}
.aval{font-size:1.2vw}
/* Tims Marathon */
.tims{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;flex:1;align-items:center}
.tcard{display:flex;flex-direction:column;align-items:center;gap:.6vw;text-align:center}
.tcard h3{margin:0;font:400 2.4vw var(--fd);letter-spacing:.04em}
.delay{width:15vw;height:15vw;display:grid;place-items:center;align-content:center;background:#7cc000;border:.35vw solid #111;font:400 5vw/1 var(--fd);color:#fff;-webkit-text-stroke:.15vw #111;
 clip-path:polygon(50% 0,61% 22%,88% 8%,80% 34%,100% 44%,80% 58%,94% 86%,66% 76%,52% 100%,40% 78%,12% 92%,20% 62%,0 50%,20% 36%,8% 10%,36% 22%)}
.delay small{font-size:1.6vw;-webkit-text-stroke:0;color:#111}
.delay.late{background:#ff3d3d}.delay.early{background:#00a6ed}
/* Statistik-Karten */
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2vw;flex:1;align-items:center}
.scard{background:var(--sc);border:.4vw solid #111;box-shadow:.5vw .5vw 0 #111;padding:1.4vw;display:flex;flex-direction:column;align-items:center;gap:.6vw;text-align:center;position:relative;min-height:60%}
.sic{position:absolute;top:-2.2vw;left:-1.4vw;width:5vw;height:5vw;border-radius:50%;background:#fff;border:.35vw solid #111;display:grid;place-items:center;font-size:2.6vw}
.scard h3{margin:0;font:400 2vw var(--fd);letter-spacing:.05em;background:#111;color:#ffcc00;padding:.2vw 1vw}
.sbig{font:400 5.2vw/1 var(--fd);color:#ff3d3d;-webkit-text-stroke:.15vw #111;text-shadow:.3vw .3vw 0 #111;overflow-wrap:anywhere}
.stxt{font-size:1.3vw}
.sbar{width:100%;height:2.4vw;border:.3vw solid #111;background:#fff;position:relative}.sbar i{position:absolute;inset:0 auto 0 0;background:#7cc000;animation:grow 1.2s ease both}
.sbar span{position:absolute;right:-.4vw;top:-2.2vw;font-size:2vw}
/* Pokalschrank */
.shelf{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.4vw;background:#f6e7d2;border:.4vw solid #111;padding:1.4vw 2vw}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;border-bottom:1.2vw solid #8a5a2b;box-shadow:0 .4vw 0 #111;padding-bottom:.2vw}
.slot{display:flex;flex-direction:column;align-items:center;gap:.4vw}
.troph{line-height:1;filter:drop-shadow(.2vw .2vw 0 #111)}
.discs{display:flex;flex-wrap:wrap;justify-content:center;gap:.3vw;max-width:12vw}
.discs .md{width:1.8vw;height:1.8vw;border-width:.15vw;box-shadow:none}
.plaque{background:#c99a3a;border:.25vw solid #111;padding:.1vw 1vw;font:400 1.6vw var(--fd);letter-spacing:.05em;margin-bottom:.4vw}
@media (prefers-reduced-motion:reduce){.btrack i,.sbar i{animation:none}}
/* Tims Marathon: Strecke */
.track{position:relative;flex:1;min-height:0;margin:0 7vw 1vw;top:-3vw}
.road{position:absolute;left:0;right:0;top:50%;height:2.6vw;margin-top:-1.3vw;background:#555;border:.35vw solid #111;
 background-image:linear-gradient(90deg,#fff 50%,transparent 50%);background-size:2.4vw .35vw;background-repeat:repeat-x;background-position:0 50%}
.road i{position:absolute;inset:0 auto 0 0;background:rgba(124,192,0,.75)}
.stn{position:absolute;top:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.stn .dot{width:2.6vw;height:2.6vw;margin-top:-1.3vw;border-radius:50%;background:#fff;border:.35vw solid #111;display:grid;place-items:center;font:400 1.5vw var(--fd);color:#fff}
.stn.done .dot{background:#7cc000}.stn.run .dot{background:#ffcc00;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.stn .lbl{position:absolute;width:10vw;text-align:center;font-size:1.05vw;line-height:1.15}
.stn .lbl b{display:block;font:400 1.4vw var(--fd);letter-spacing:.04em}
.stn.dn .lbl{top:2vw}.stn.dn2 .lbl{top:5.6vw}
.stn.dn2::after{content:"";position:absolute;top:1.3vw;height:4.3vw;border-left:.2vw dashed #111}
.stn.done .lbl{color:#4a7a00}
.runner{position:absolute;top:50%;transform:translate(-50%,-100%);margin-top:-1.8vw;z-index:3;display:flex;flex-direction:column;align-items:center;transition:left 1s}
.meeple{width:4.2vw;height:4.2vw;fill:#ff3d3d;stroke:#111;stroke-width:6;stroke-linejoin:round;filter:drop-shadow(.25vw .25vw 0 #111);animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8vw)}}
.runner b{background:#ff3d3d;color:#fff;border:.25vw solid #111;font:400 1.2vw var(--fd);padding:0 .6vw;letter-spacing:.05em}
.flag{position:absolute;top:50%;transform:translateY(-50%);font:400 1.2vw/1.1 var(--fd);text-align:center;background:#111;color:#ffcc00;padding:.3vw .5vw;letter-spacing:.05em}
.flag.start{left:-6.6vw}.flag.goal{right:-6.6vw;background-image:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0);background-size:1vw 1vw;color:#111;-webkit-text-stroke:0;text-shadow:0 0 .3vw #fff,0 0 .3vw #fff}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw}
.tst{background:var(--c);border:.4vw solid #111;box-shadow:.4vw .4vw 0 #111;padding:.8vw 1vw;display:flex;align-items:center;gap:.9vw}
.tst .ti{font-size:3vw}
.tst b{display:block;font:400 3vw/1 var(--fd);letter-spacing:.03em}
.tst small{font-size:1.1vw}
@media (prefers-reduced-motion:reduce){.stn.run .dot,.meeple{animation:none}}
.big{font:400 5vw/1 var(--fd);letter-spacing:.03em;color:var(--red);-webkit-text-stroke:.12vw #111}
.empty{flex:1;display:grid;place-items:center;text-align:center;font:400 3vw var(--fd);color:#555}
.bar{height:2vw;border:.3vw solid #111;background:#fff;position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--green)}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <h1>Tims Brettspielmarathon</h1>
    <div class="sp"></div>
    <div class="prog" title="Marathon-Fortschritt"><i id="progbar" style="width:0"></i><span id="progtxt"></span></div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="stage" id="stage"><div class="panel on"><div class="empty">Lade Leaderboard …</div></div></div>
  <div class="dots" id="dots"></div>
  <div class="ticker off" id="tickerBox"><b>LIVE</b><div class="tview"><div class="ttrack" id="ticker"></div></div></div>
</div>
<script src="stats.js?v=1794912408"></script>
<script>
const {esc,fmtClock,fmtDur,fmtDurShort,norm}=BSM;
const COLS=["#ffd9d9","#fff3bf","#cdeeff","#e5f6c8","#ffe2c7","#f6d8ff"];
let S=null,C=null,idx=0,panels=[];

function coverOf(name){return BSM.coverOf(S,name);}
function cv(name,cls){const u=coverOf(name);return u?`<img class="cv ${cls||""}" src="${esc(u)}" alt="" referrerpolicy="no-referrer">`:"";}
function emptyP(t){return `<div class="empty">${t}</div>`;}

const BARC=["#ffcc00","#b8c0ca","#d08a52","#00a6ed","#7cc000","#d63af9","#ff7a00","#ff3d3d","#00a6ed"];
function champPanel(){
  const list=C.byPoints.slice(0,8),max=Math.max(1,...list.map(x=>x.points));
  return `<h2>🏆 Marathon-Champion <small>1 Punkt pro geschlagenem Gegner</small></h2><div class="bars">${list.map((x,i)=>`
    <div class="brow"><span class="bpos ${i<3?"p"+(i+1):""}">${i+1}</span><span class="bname">${esc(x.name)}</span>
    <span class="btrack"><i style="width:${Math.max(4,x.points/max*100)}%;--bc:${BARC[i]}"><b>${x.points}</b></i></span>
    <span class="bmeta">${x.plays} Partien · ${x.wins} Siege · ${fmtDurShort(x.time)} h</span></div>`).join("")}</div>`;
}
function kingPanel(){
  const list=C.byQuote.slice(0,8);
  return `<h2>🎯 Spielkönig <small>Anteil geschlagener Gegner, ab 2 Partien</small></h2><div class="kings">${list.map((x,i)=>{const q=Math.round(x.quote*100);
    return `<div class="king ${i===0?"top":""}"><div class="ring" style="--q:${q}"><span>${q}<small>%</small></span></div>${i===0?`<div class="crown">👑</div>`:""}<div class="kn">${i+1}. ${esc(x.name)}</div><div class="km">${x.plays} Partien</div></div>`;}).join("")}</div>`;
}
function awardPanel(){
  return `<h2>⭐ Awards</h2><div class="awards">${C.awards.map((a,i)=>`
    <div class="acard" style="--ac:${COLS[i%6]};--rot:${i%2?1.5:-1.5}deg"><div class="aburst">${a.icon}</div><div class="aband">${esc(a.title)}</div>
    <div class="awho">${esc(a.who)}</div><div class="aval">${esc(a.val)}</div></div>`).join("")}</div>`;
}
function timPanel(){
  const t=C.tim,q=t.quote==null?null:Math.round(t.quote*100);
  const d=t.delay,dTxt=d==null?"–":d>0?"+"+d+" min":d<0?d+" min":"±0",dCls=d==null?"":d>5?"late":d<-5?"early":"ok";
  const T0=8*60,games=S.games.filter(g=>g.host!==false),T1=Math.max(T0+60,...games.map(g=>g.e));
  const pos=v=>Math.max(0,Math.min(100,(v-T0)/(T1-T0)*100));
  const groups=[];games.forEach(g=>{const l=groups[groups.length-1];if(l&&l.s===g.s)l.items.push(g);else groups.push({s:g.s,items:[g]});});
  const st=g=>{const p=C.plays.find(x=>x.game===g.name);return !p?"":p.done?"done":"run";};
  const stations=groups.map((gr,i)=>{const s=gr.items.map(st),cls=s.every(x=>x==="done")?"done":s.some(x=>x)?"run":"";
    return `<div class="stn ${cls} ${i%2?"dn2":"dn"}" style="left:${pos(gr.s)}%"><span class="dot">${cls==="done"?"✓":""}</span>
      <span class="lbl"><b>${BSM.fmtClock(gr.s)}</b>${gr.items.map(g=>esc(g.name.replace(/ Legends Volume 2/," Vol. 2"))).join(" ∥ ")}</span></div>`;}).join("");
  const runner=pos(C.now);
  return `<h2>🎂 Tims Marathon <small>Station für Station durch den Tag</small></h2>
  <div class="track"><div class="road"><i style="width:${runner}%"></i></div>${stations}
    <div class="runner" style="left:${runner}%"><svg class="meeple" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8C61 8 66 16 66 24C66 31 62 35 60 37C72 39 92 44 92 54C92 60 84 60 76 58C72 57 70 60 72 66L82 90C84 95 80 96 76 96L58 96C55 96 53 94 52 90L50 82L48 90C47 94 45 96 42 96L24 96C20 96 16 95 18 90L28 66C30 60 28 57 24 58C16 60 8 60 8 54C8 44 28 39 40 37C38 35 34 31 34 24C34 16 39 8 50 8Z"/></svg><b>Tim</b></div>
    <div class="flag start">START<br>08:00</div><div class="flag goal">ZIEL<br>${BSM.fmtClock(T1)}</div></div>
  <div class="tstats">
    <div class="tst" style="--c:#fff3bf"><span class="ti">⏱️</span><div><b>${fmtDurShort(t.time)} h</b><small>gespielt · ${t.plays} Partien</small></div></div>
    <div class="tst" style="--c:#e5f6c8"><span class="ti">🏆</span><div><b>${q==null?"–":q+" %"}</b><small>Siegquote · ${t.wins} Siege</small></div></div>
    <div class="tst ${dCls}" style="--c:${dCls==="late"?"#ffd9d9":dCls==="early"?"#cdeeff":"#e5f6c8"}"><span class="ti">${dCls==="late"?"🐢":dCls==="early"?"🚀":"👍"}</span><div><b>${dTxt}</b><small>${d==null?"noch nicht gestartet":d>5?"hinter dem Zeitplan":d<-5?"vor dem Zeitplan":"voll im Zeitplan"}</small></div></div>
    <div class="tst" style="--c:#f6d8ff"><span class="ti">🏁</span><div><b>${t.progress} %</b><small>des Marathons geschafft</small></div></div>
  </div>`;
}
function statPanel(part,i){
  return `<h2>📊 Statistik</h2><div class="stats">${part.map((s,j)=>`
    <div class="scard" style="--sc:${COLS[(i+j+3)%6]};--rot:${(i+j)%2?1:-1}deg"><div class="sic">${s.icon}</div><h3>${esc(s.title)}</h3>
    ${s.game?cv(s.game,"sm"):""}<div class="sbig" style="font-size:${s.big.length>14?3:s.big.length>8?4:5.2}vw">${esc(s.big)}</div><div class="stxt">${esc(s.text)}</div>
    ${s.bar!=null?`<div class="sbar"><i style="width:${s.bar}%"></i><span>🏁</span></div>`:""}</div>`).join("")}</div>`;
}
function shelfPanel(){
  const list=C.medals.slice(0,12),rows=[];for(let i=0;i<list.length;i+=4)rows.push(list.slice(i,i+4));
  const disc=(n,c)=>Array.from({length:n},()=>`<i class="md ${c}"></i>`).join("");
  return `<h2>🏅 Pokalschrank</h2><div class="shelf">${rows.map(r=>`<div class="srow">${r.map(x=>{const tr=x.gold>=3?"🏆":x.gold?"🥇":x.silver?"🥈":"🥉";
    return `<div class="slot"><div class="troph" style="font-size:${x.gold>=3?5.5:x.gold?4.2:3.4}vw">${tr}</div><div class="discs">${disc(x.gold,"")}${disc(x.silver,"s")}${disc(x.bronze,"b")}</div><div class="plaque">${esc(x.name)}</div></div>`;}).join("")}</div>`).join("")}</div>`;
}
function medalPanel(){
  const m=C.medals,top=m.slice(0,3),rest=m.slice(0,10);
  const cnt=x=>`<div class="cnt"><span><i class="md"></i>${x.gold}</span><span><i class="md s"></i>${x.silver}</span><span><i class="md b"></i>${x.bronze}</span></div>`;
  const pod=(x,r)=>x?`<div class="pod p${r}"><i class="rib"></i><span class="md big ${r===2?"s":r===3?"b":""}">${r}</span><div class="nm">${esc(x.name)}</div>${cnt(x)}<div class="blk">${r}</div></div>`:`<div class="pod p${r}"></div>`;
  const z=v=>v?v:`<span class="zero">0</span>`;
  return `<h2>🥇 Medaillenspiegel</h2><div class="ms">
    <div class="podium">${pod(top[1],2)}${pod(top[0],1)}${pod(top[2],3)}</div>
    <table class="mt"><tr><th>Rang</th><th>Name</th><th class="c"><i class="md"></i></th><th class="c"><i class="md s"></i></th><th class="c"><i class="md b"></i></th><th class="c">Gesamt</th></tr>${
      rest.map((x,i)=>`<tr class="${i?"":"first"}"><td class="rank">${i+1}.</td><td>${esc(x.name)}</td><td class="c">${z(x.gold)}</td><td class="c">${z(x.silver)}</td><td class="c">${z(x.bronze)}</td><td class="c sum">${x.gold+x.silver+x.bronze}</td></tr>`).join("")}</table></div>`;
}
function chips(list){return `<div class="names">${list.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div>`;}

function build(){
  const out=[];
  out.push(()=>!C.running.length?`<h2>▶ Läuft gerade</h2>${emptyP("Gerade läuft keine Partie")}`:`<h2>▶ Läuft gerade</h2><div class="grid" style="grid-template-columns:repeat(${Math.min(3,C.running.length)},1fr)">${
    C.running.map((p,i)=>{const over=p.plan?Math.round(p.dur-p.plan.duration):null;
      return `<div class="card" style="--c:${COLS[i%6]}"><div class="cvrow">${cv(p.game)}<div><h3>${esc(p.game)}</h3><div class="timer" data-start="${p.s}">${fmtDurShort(p.dur)}</div></div></div>
      <div>seit ${esc(p.start)} Uhr${over!=null&&over>0?` · <span style="color:#c00">${over} min über Plan</span>`:p.plan?` · geplant ${p.plan.duration} min`:""}</div>${chips(p.players.map(x=>x.name))}</div>`;}).join("")}</div>`);
  out.push(()=>!C.next.length?`<h2>⏭ Gleich geht's los</h2>${emptyP("Alle geplanten Spiele sind gestartet")}`:`<h2>⏭ Gleich geht's los</h2><div class="grid" style="grid-template-columns:repeat(${C.next.length},1fr)">${
    C.next.map((g,i)=>{const pl=[...(g.host!==false?[S.host]:[]),...S.bookings.filter(b=>b.key===g.name).map(b=>b.name)];
      return `<div class="card" style="--c:${COLS[(i+2)%6]}"><div class="cvrow">${cv(g.name)}<div><h3>${esc(g.name)}</h3><div class="timer">${esc(g.start)} Uhr</div></div></div><div>${g.duration} min geplant · ${pl.length} von ${g.seats} Plätzen belegt</div>${chips(pl)}</div>`;}).join("")}</div>`);
  out.push(()=>!C.medals.length?`<h2>🥇 Medaillenspiegel</h2>${emptyP("Noch keine Medaillen vergeben")}`:medalPanel());
  out.push(()=>!C.byPoints.length?`<h2>🏆 Marathon-Champion</h2>${emptyP("Noch keine Partie beendet")}`:champPanel());
  out.push(()=>!C.byQuote.length?`<h2>🎯 Spielkönig</h2>${emptyP("Wertung ab 2 beendeten Partien")}`:kingPanel());
  out.push(()=>awardPanel());
  out.push(()=>timPanel());
  const st=C.stats;
  const pages=Math.ceil(st.length/3),per=Math.ceil(st.length/pages);
  for(let i=0;i<st.length;i+=per){const part=st.slice(i,i+per);out.push(()=>statPanel(part,i));}
  out.push(()=>!C.medals.length?`<h2>🏅 Pokalschrank</h2>${emptyP("Der Pokalschrank ist noch leer")}`:shelfPanel());
  return out;
}

function show(){
  if(!C)return;
  panels=build(); if(idx>=panels.length)idx=0;
  const stage=document.getElementById("stage");
  const old=stage.querySelector(".panel.on");
  const el=document.createElement("div");el.className="panel";el.innerHTML=panels[idx]();
  stage.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
  if(old){old.classList.remove("on");setTimeout(()=>old.remove(),700);}
  document.getElementById("dots").innerHTML=panels.map((_,i)=>`<i class="${i===idx?"on":""}"></i>`).join("");
}
let lastTicker="";
function renderTicker(){if(!C.ticker)return;const t=C.ticker.map(s=>"+++ "+s+" ").join("")+"+++";if(t===lastTicker)return;lastTicker=t;
  const el=document.getElementById("ticker");el.textContent=t;el.style.setProperty("--dur",Math.max(20,Math.round(t.length/7))+"s");}
// Live-Ticker: alle 20 Minuten für 2 Minuten (zur vollen, 20. und 40. Minute)
const TICKER_EVERY=20,TICKER_FOR=2;
function tick(){
  const now=BSM.nowMin();
  const d=new Date(),on=d.getMinutes()%TICKER_EVERY<TICKER_FOR;
  document.getElementById("tickerBox").classList.toggle("off",!on);
  document.getElementById("clock").textContent=fmtClock(now);
  document.querySelectorAll(".panel.on .timer[data-start]").forEach(t=>{t.textContent=fmtDurShort(now-Number(t.dataset.start));});
  if(C){document.getElementById("progbar").style.width=C.tim.progress+"%";document.getElementById("progtxt").textContent="Marathon "+C.tim.progress+" %";}
}
function load(){BSM.loadState("").then(st=>{S=st;C=BSM.compute(S);renderTicker();if(!document.querySelector(".panel.on .card,.panel.on table,.panel.on .award,.panel.on .big"))show();tick();}).catch(()=>{});}
load();setInterval(load,15000);setInterval(tick,1000);
setInterval(()=>{if(!C)return;C=BSM.compute(S);idx=(idx+1)%Math.max(1,build().length);show();},20000);
document.addEventListener("keydown",e=>{if(!C)return;if(e.key==="ArrowRight"){idx=(idx+1)%panels.length;show();}if(e.key==="ArrowLeft"){idx=(idx-1+panels.length)%panels.length;show();}
  if(e.key==="f")document.documentElement.requestFullscreen?.().catch(()=>{});});
document.addEventListener("dblclick",()=>document.documentElement.requestFullscreen?.().catch(()=>{}));
</script>
</body>
</html>
